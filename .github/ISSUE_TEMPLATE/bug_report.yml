name: Bug report
description: Something broke, matched wrong, or deleted wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: forage version
      description: From http://<host>:7979/healthz — the "version" field.
      placeholder: v0.3.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is it running?
      options:
        - Single binary (Windows)
        - Single binary (macOS)
        - Single binary (Linux)
        - Docker
        - Built from source
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: >-
        What you did, what you expected, what happened instead. If a release
        matched to the wrong scene, include the release title and the
        StashDB ids of the wrong and right scenes.
    validations:
      required: true
  - type: textarea
    id: diag
    attributes:
      label: Diagnostics bundle
      description: >-
        Paste the JSON from http://<host>:7979/diag (log in first — it's the
        same auth as the UI). It carries versions, which settings are
        configured and where each came from, client reachability, poller
        state, and the last recovered crash. Secrets are masked; it does
        include your library paths and service URLs, so skim before posting
        if those are private. Fallback if you can't reach /diag: the
        unauthenticated /healthz.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: >-
        Daemon output around the problem (docker logs forager, or the
        terminal the binary runs in). Redact anything you consider private —
        release names in logs are the usual thing to check.
      render: shell
  - type: markdown
    attributes:
      value: >-
        **If files were deleted or trashed unexpectedly:** the deletion
        journal is the evidence — paste the relevant rows from
        `/destructions` (or the Deletions page). Trashed entries are
        restorable from that page for 7 days.


        **If downloads finish but nothing lands in the library:** see
        [docs/troubleshooting.md](../blob/main/docs/troubleshooting.md) —
        it covers the three setup mistakes behind nearly all such reports.
