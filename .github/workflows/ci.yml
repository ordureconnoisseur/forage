name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so a quick succession of pushes
# doesn't queue up redundant builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  daemon:
    name: Daemon (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Fuzzing hardens our own parsers; it cannot see a known hang one frame
      # deeper in a dependency. GO-2026-5970 (infinite loop in x/text norm)
      # was reachable from fold, the first call in both Tokenize and
      # ExtractJAVCodes, which is to say: from the exact functions the fuzz
      # step below exercises, on the exact input those functions exist to
      # distrust. A hand audit found it; nothing in CI would have.
      #
      # This gate blocks. The tool is pinned but the vulnerability database
      # is queried fresh every run, so a new advisory against something we
      # actually call fails the build instead of waiting for the next audit.
      # go.mod's toolchain line keeps the standard library in scope too.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      # -race because the poller, client pool and session cache are
      # genuinely concurrent, and nothing else proves them so. Roughly
      # doubles test time; that is the right trade for a daemon whose
      # failure mode is a user's media library.
      - name: Test (race detector)
        run: go test -race ./...

      # Short fuzz pass over the hostile-input parsers (release names in
      # any script/punctuation). The saved corpus under testdata/fuzz
      # replays every past finding as a plain test above; this step spends
      # a little time looking for NEW ones on every push. Nightly/local
      # runs can go longer. FuzzTokenize found a real tokenizer bug
      # (all-caps run fusing into a following CJK/Hangul token) in under a
      # second of its first run.
      - name: Fuzz (smoke)
        run: |
          go test ./internal/matcher/ -run='^$' -fuzz=FuzzTokenize -fuzztime=20s
          go test ./internal/matcher/ -run='^$' -fuzz=FuzzExtractJAVCodes -fuzztime=20s

  plugin:
    name: Plugin (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install
        run: npm ci

      # `npm run build` is `tsc -b && vite build`, so this also
      # type-checks the whole plugin.
      - name: Build
        run: npm run build

      # The committed embed at internal/api/ui/index.html is what a plain
      # `go build` serves, so it has to track plugin source. It silently
      # drifted three days behind once, shipping a wizard missing half its
      # steps to every non-Docker build, and only a hand-run headless
      # walkthrough caught it. The bundle is byte-reproducible from the
      # lockfile, so a diff is a reliable gate.
      - name: Committed SPA embed is current
        run: |
          if ! diff -q dist/index.html ../internal/api/ui/index.html >/dev/null; then
            echo "internal/api/ui/index.html is stale against plugin/src."
            echo "Run 'make ui' and commit the regenerated embed."
            diff -u ../internal/api/ui/index.html dist/index.html | head -40
            exit 1
          fi
          echo "embed matches a fresh build"
