name: Release

# Cut a release by pushing a semver tag, e.g. `git tag v0.1.0 && git push
# origin v0.1.0`. Builds + publishes the daemon image to GHCR and attaches
# a ready-to-drop-in plugin bundle to the GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  packages: write # push the image to GHCR

jobs:
  image:
    name: Daemon image → GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR requires a lowercase image path; the repo is already
          # lowercase (ordureconnoisseur/forager).
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}

  release:
    name: Binaries + plugin bundle + GitHub Release
    runs-on: ubuntu-latest
    # Deliberately NOT `needs: image`. The binaries and the plugin bundle are
    # what someone actually downloads to try forage; a registry problem (an
    # expired token, a package still linked to another repo, GHCR being down)
    # must not stop them being published. The image is a parallel convenience.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Build plugin
        working-directory: plugin
        run: |
          npm ci
          npm run build

      - name: Package plugin (launcher only — the daemon serves the app)
        run: |
          mkdir -p bundle/forage
          cp plugin/forage.yml plugin/dist/forage.entry.js plugin/dist/launch.html bundle/forage/
          (cd bundle && zip -r "../forage-plugin-${GITHUB_REF_NAME}.zip" forage)

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # Embed the SPA we just built, exactly as the Dockerfile does. Without
      # this the binaries would ship whatever bundle happens to be committed
      # at internal/api/ui/index.html, which lags the source.
      - name: Embed the freshly-built SPA
        run: cp plugin/dist/index.html internal/api/ui/index.html

      # Single self-contained executables. CGO_ENABLED=0 keeps
      # modernc.org/sqlite in pure-Go mode and the UI is go:embed'ed, so each
      # file is the whole application: no runtime, no libs, no assets beside
      # it. Run it in an empty directory and it creates its own database.
      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            echo "building $os/$arch"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" \
              -o "dist/forage-${os}-${arch}${ext}" .
          done
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            forage-plugin-*.zip
            dist/forage-*
            dist/SHA256SUMS.txt
          body: |
            ## forage ${{ github.ref_name }}

            ### Run it

            Download the file for your machine, run it, open
            <http://127.0.0.1:7979>. A setup wizard does the rest.

            | | |
            |---|---|
            | Windows | `forage-windows-amd64.exe` |
            | macOS (Apple silicon) | `forage-darwin-arm64` |
            | macOS (Intel) | `forage-darwin-amd64` |
            | Linux | `forage-linux-amd64` · `forage-linux-arm64` |

            No runtime, no dependencies, no config file. It keeps its
            database in the folder you run it from. On macOS/Linux:
            `chmod +x forage-* && ./forage-*`.

            Checksums in `SHA256SUMS.txt`.

            **Docker instead:** `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
            (also tagged `:latest`) — see the
            [README](https://github.com/${{ github.repository }}#install).

            **Plugin (optional launcher):** download
            `forage-plugin-${{ github.ref_name }}.zip`, unzip, and copy the
            `forage/` folder into your Stash `plugins/` directory. Reload
            plugins → the **Forage** nav button opens your daemon. (forage
            runs standalone; the plugin is just a convenient launcher.)
